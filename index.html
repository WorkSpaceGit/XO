<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #121212;
    color: #fff;
    font-family: sans-serif;
  }

  #game {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 80vw;
    height: 80vw;
    max-width: 600px;
    max-height: 600px;
    background: #1e1e1e;
    border: 5px solid #fff;
    position: relative;
  }

  .cell {
    border: 1px solid #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 8vw;
    cursor: pointer;
    transition: background 0.2s;
    user-select: none;
  }

  .cell:hover {
    background: #333;
  }

  .line {
    position: absolute;
    background: red;
    z-index: 10;
    border-radius: 2px;
    display: none;
  }
</style>
</head>
<body>

<div id="game"></div>

<script>
const game = document.getElementById('game');
let board = Array(9).fill('');
let currentPlayer = 'X';
let gameOver = false;
let moves = 0;

// Кеш координат центрів клітинок
let centers = [];

// Лінія перемоги (одна на всю гру)
const line = document.createElement('div');
line.className = 'line';
game.appendChild(line);

// Створюємо клітинки
for (let i = 0; i < 9; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.index = i;
  game.appendChild(cell);
}

// Оновлюємо кеш координат
function updateCenters() {
  const gameRect = game.getBoundingClientRect();
  centers = Array.from(game.children)
    .filter(c => c.classList.contains('cell'))
    .map(cell => {
      const rect = cell.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - gameRect.left,
        y: rect.top + rect.height / 2 - gameRect.top
      };
    });
}
updateCenters();

// Debounce для resize
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(updateCenters, 150);
});

// Делегуємо події
game.addEventListener('click', (e) => {
  const target = e.target;
  if (!target.classList.contains('cell') || gameOver) return;

  const idx = +target.dataset.index;
  if (board[idx] !== '') return;

  board[idx] = currentPlayer;
  target.textContent = currentPlayer;
  moves++;

  if (checkWin()) {
    gameOver = true;
    return;
  }

  if (moves === 9) {
    gameOver = true;
    return;
  }

  currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
});

// Перевірка перемоги
function checkWin() {
  const wins = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];

  for (let combo of wins) {
    const [a,b,c] = combo;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      drawLine(a, c);
      return true;
    }
  }
  return false;
}

// Малюємо лінію
function drawLine(a, c) {
  const p1 = centers[a];
  const p2 = centers[c];
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;

  const length = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;

  line.style.width = `${length}px`;
  line.style.height = '5px';
  line.style.top = `${p1.y - 2.5}px`;
  line.style.left = `${p1.x}px`;
  line.style.transformOrigin = '0 50%';
  line.style.transform = `rotate(${angle}deg)`;
  line.style.display = 'block';
}
</script>

</body>
</html>
